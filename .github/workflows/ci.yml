name: CI

# One job, on pull requests and pushes to main that change code. Docs-only changes don't run.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', 'NOTICE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', 'NOTICE']

# A newer push to the same branch or pull request cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Syntax check
        run: npm run check
      - name: Tests
        run: npm test
